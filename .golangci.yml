# Generated by go-baseline from go.mod. Don't edit: change the baseline, then
# run `go tool go-baseline write`.
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - revive
    - testpackage
  settings:
    depguard:
      rules:
        # The functional core: pure functions over values. It imports only
        # other core packages, the standard library's pure packages and
        # third-party libraries.
        core:
          list-mode: lax
          files:
            - "**/internal/core/**"
            - "!$test"
          allow:
            - github.com/ianflanagan1/go-baseline/internal/core
            - net/mail
            - net/netip
            - net/url
          deny:
            - pkg: github.com/ianflanagan1/go-baseline
              desc: the core imports only the core
            - pkg: log
              desc: the core does no I/O
            - pkg: crypto/rand
              desc: the core does no I/O
            - pkg: database/sql
              desc: the core does no I/O
            - pkg: io/ioutil
              desc: the core does no I/O
            - pkg: math/rand
              desc: the core does no I/O
            - pkg: net
              desc: the core does no I/O
            - pkg: os
              desc: the core does no I/O
            - pkg: plugin
              desc: the core does no I/O
            - pkg: syscall
              desc: the core does no I/O
        # The shell reaches outside dependencies only through ports, as
        # adapters that cmd/ wires in.
        shell:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!**/cmd/**"
            - "!**/internal/adapters/**"
          allow:
            - net/mail
            - net/netip
            - net/url
          deny:
            - pkg: github.com/ianflanagan1/go-baseline/internal/adapters
              desc: reach adapters through their ports; wire them in cmd/
            - pkg: crypto/rand
              desc: reach outside dependencies through ports
            - pkg: database/sql
              desc: reach outside dependencies through ports
            - pkg: io/ioutil
              desc: reach outside dependencies through ports
            - pkg: math/rand
              desc: reach outside dependencies through ports
            - pkg: net
              desc: reach outside dependencies through ports
            - pkg: os
              desc: reach outside dependencies through ports
            - pkg: plugin
              desc: reach outside dependencies through ports
            - pkg: syscall
              desc: reach outside dependencies through ports
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until|Sleep|After|AfterFunc|Tick|NewTimer|NewTicker)$
          msg: the clock is an adapter; take it through a port
    gochecksumtype:
      default-signifies-exhaustive: false
    revive:
      enable-default-rules: true
      rules:
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forbidigo
      - path: (^|/)(cmd|internal/adapters)/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
