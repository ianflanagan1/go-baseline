# Generated by go-baseline. Don't edit: change the baseline, then run
# `go tool go-baseline write`. The project's own tasks go in
# Taskfile.project.yml.
version: '3'

includes:
  project:
    taskfile: ./Taskfile.project.yml
    optional: true
    flatten: true

tasks:
  check:
    desc: Verify the project against go-baseline, then lint and test it
    cmds:
      - go tool go-baseline verify
      - task: lint
      - task: test

  lint:
    desc: Lint, and check formatting
    cmds:
      - golangci-lint run
      - golangci-lint fmt --diff

  lint-file:
    desc: 'Format, fix and lint the Go files given after --, leaving other files alone: task lint-file -- <file>...'
    vars:
      GO_FILES: '{{range .CLI_ARGS_LIST}}{{if hasSuffix ".go" .}}{{shellQuote .}} {{end}}{{end}}'
      # golangci-lint type-checks whole packages, so it lints each file's directory.
      PACKAGES: '{{$dirs := list}}{{range .CLI_ARGS_LIST}}{{if hasSuffix ".go" .}}{{$dirs = append $dirs (dir .)}}{{end}}{{end}}{{range uniq $dirs}}{{shellQuote (ternary . (printf "./%s" .) (isAbs .))}} {{end}}'
    cmds:
      - '{{if .GO_FILES}}golangci-lint fmt {{.GO_FILES}} && golangci-lint run --fix {{.PACKAGES}}{{end}}'

  test:
    desc: The tests, then each core package's coverage
    cmds:
      - go tool go-baseline test

  integration:
    desc: Every test, including those behind the integration build tag, which need real outside services
    cmds:
      - go test -tags integration ./...
