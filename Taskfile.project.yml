version: '3'

tasks:
  new:
    desc: >-
      Create a Go application from go-template:
      task new MODULE=<module-path> DIR=<absolute-dir>
    requires:
      vars: [MODULE, DIR]
    cmds:
      - task: new:copy
      - task: new:application
      - task: new:finish

  new-library:
    desc: >-
      Create a Go library, with only a core, from go-template:
      task new-library MODULE=<module-path> DIR=<absolute-dir>
    requires:
      vars: [MODULE, DIR]
    cmds:
      - task: new:copy
      - task: new:library
      - task: new:finish

  new:copy:
    internal: true
    preconditions:
      - sh: '[ {{isAbs .DIR}} = true ]'
        msg: DIR must be an absolute path, since devbox runs tasks from this repository's root
    cmds:
      # go-template has no releases, so gonew copies its trunk's latest commit. Ask GitHub
      # directly: the module proxy caches @latest, so it can lag a push.
      - GOPROXY=direct go run golang.org/x/tools/cmd/gonew@v0.52.0 github.com/ianflanagan1/go-template {{shellQuote .MODULE}} {{shellQuote .DIR}}

  new:application:
    internal: true
    dir: '{{.DIR}}'
    vars:
      NAME: '{{base .MODULE}}'
      MAIN: cmd/{{base .MODULE}}/main.go
      README: |
        # {{base .MODULE}}

        TODO: what it does, and for whom.

        ## Running

        ```sh
        devbox run -- task build
        ./bin/{{base .MODULE}}
        ```

        ## Configuration

        Read only in `cmd/{{base .MODULE}}`.

        | Environment variable or flag | Meaning | Default |
        |---|---|---|

        ## Architecture

        `go tool go-baseline map` lists each package's role, the ports the shell declares and the adapters that implement them. The rules are in `BASELINE.md`.
    cmds:
      - mv cmd/app cmd/{{shellQuote .NAME}}
      # -i.bak works with both GNU and BSD (macOS) sed.
      - sed -i.bak {{shellQuote (printf "s/^\\/\\/ Command app /\\/\\/ Command %s /; s/\"app:\"/\"%s:\"/" .NAME .NAME)}} {{shellQuote .MAIN}}
      - rm {{shellQuote .MAIN}}.bak
      - |
        if ! grep -q {{shellQuote (printf "^// Command %s " .NAME)}} {{shellQuote .MAIN}} || ! grep -q {{shellQuote (printf "\"%s:\"" .NAME)}} {{shellQuote .MAIN}}; then
          echo "new: couldn't rename the command in {{.MAIN}}; go-template's main.go has changed" >&2
          exit 1
        fi
      - printf '%s' {{shellQuote .README}} > README.md

  new:library:
    internal: true
    dir: '{{.DIR}}'
    vars:
      # The package is named for the module, without a go- prefix, hyphens or dots.
      PACKAGE: '{{base .MODULE | trimPrefix "go-" | replace "-" "" | replace "." "" | lower}}'
      README: |
        # {{base .MODULE}}

        TODO: what it provides, and for whom.

        ## Usage

        ```go
        import "{{.MODULE}}/core/{{.PACKAGE}}"
        ```

        ## Architecture

        `go tool go-baseline map` lists each package's role. The rules are in `BASELINE.md`.
    preconditions:
      - sh: '[ {{regexMatch "^[a-z_][a-z0-9_]*$" .PACKAGE}} = true ]'
        msg: new can't make a package name from {{base .MODULE}}
    cmds:
      # A library builds no programs, so it has neither cmd/ nor go-template's build task.
      - rm -r cmd Taskfile.project.yml
      - mkdir -p core/{{shellQuote .PACKAGE}}
      - |
        printf '// Package %s TODO: say what it provides.\npackage %s\n' {{shellQuote .PACKAGE}} {{shellQuote .PACKAGE}} > core/{{shellQuote .PACKAGE}}/doc.go
      - printf '%s' {{shellQuote .README}} > README.md

  new:finish:
    internal: true
    dir: '{{.DIR}}'
    cmds:
      - rm LICENSE
      # Start on the latest go-baseline, not the version go-template pins. Ask
      # GitHub directly: the module proxy caches @latest, so it can lag a release.
      - GOPROXY=direct go get -tool github.com/ianflanagan1/go-baseline/cmd/go-baseline@latest
      - go mod tidy
      - go tool go-baseline write
      - devbox run -- task check
      - git init --quiet --initial-branch=main
      - git add --all
      - git commit --quiet --message "Initialise from go-template"
      - echo "Created {{.MODULE}} in {{.DIR}}"

  rulebook-coverage:
    desc: Write rulebook-coverage.json, how go-baseline enforces the code rulebook, for the rulebook to import
    cmds:
      - go run ./cmd/go-baseline rulebook > rulebook-coverage.json
